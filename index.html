<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravity Shift — V1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PHYSICS PLATFORMER</p>
        <h1>GRAVITY <span>SHIFT</span></h1>
      </div>
      <div class="status">
        <span class="status-label">GRAVITY</span>
        <strong id="gravityStatus">↓ DOWN</strong>
      </div>
    </header>

    <section class="game-frame">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Gravity Shift game"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="overlayEyebrow">MISSION 01</p>
          <h2 id="overlayTitle">Gravity Shift</h2>
          <p id="overlayText">Reach the exit. Flip gravity to navigate the facility.</p>
          <button id="startButton">START GAME</button>
        </div>
      </div>
    </section>

    <footer class="controls">
      <div><kbd>A</kbd><kbd>D</kbd> <span>Move</span></div>
      <div><kbd>←</kbd><kbd>→</kbd> <span>Move</span></div>
      <div><kbd>SPACE</kbd> <span>Jump</span></div>
      <div><kbd>G</kbd> <span>Flip gravity</span></div>
      <div><kbd>R</kbd> <span>Restart</span></div>
    </footer>
    <p class="hint">Tip: You can land on platforms from above or below. Gravity is your tool.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
